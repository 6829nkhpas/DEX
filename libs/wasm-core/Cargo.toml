[package]
name = "wasm-core"
version = "1.0.0"
edition = "2021"
authors = ["Exchange Team"]
description = "Client-side deterministic computation layer for DEX"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable WASM-specific bindings and adapter code.
# This feature is a marker — actual wasm32 compilation is controlled by --target.
wasm = []
# Enable host-side WASM runtime execution via wasmtime.
# This is for the HOST that runs .wasm modules, not for code compiled to WASM.
wasm-host = ["dep:wasmtime"]

[dependencies]
# Internal types (frozen)
types = { path = "../types" }

# Deterministic decimal arithmetic
rust_decimal = { version = "1.36", features = ["serde", "serde-str"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID for identifiers
uuid = { version = "1.11", features = ["v7", "serde"] }

# Hashing (SHA-256 for signing module)
sha2 = "0.10"

# Ed25519 signing
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Hex encoding for signatures
hex = "0.4"

# Error handling
thiserror = "1.0"

# WASM host runtime (optional — only for host-side WASM execution)
wasmtime = { version = "40", optional = true, default-features = false, features = ["cranelift", "runtime"] }

[dev-dependencies]
rand = "0.8"
