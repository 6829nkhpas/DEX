# Production overrides
replicaCount: 3

image:
  repository: "${REGISTRY}/dex-web-ui"
  tag: "prod-latest"
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dex.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dex-ui-prod-tls
      hosts:
        - dex.example.com

config:
  VITE_API_BASE_URL: /v1
  VITE_WS_URL: ws://gateway:8080/v1/ws
  VITE_TELEMETRY_ENABLED: "true"
  VITE_TELEMETRY_SAMPLE_RATE: "0.001"
  VITE_DEV_MODE: "false"
  VITE_DEBUG_PANEL: "false"
  VITE_METRICS_ENABLED: "true"
