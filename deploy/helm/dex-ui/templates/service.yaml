apiVersion: v1
kind: Service
metadata:
  name: { { include "dex-ui.fullname" . } }
  labels: { { - include "dex-ui.labels" . | nindent 4 } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: { { .Values.service.port } }
      targetPort: http
      protocol: TCP
      name: http
    - port: { { .Values.service.metricsPort } }
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector: { { - include "dex-ui.selectorLabels" . | nindent 4 } }
