[package]
name = "risk-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
types = { path = "../../libs/types" }
rust_decimal = "1.33"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v7"] }

[dev-dependencies]
proptest = "1.4"
